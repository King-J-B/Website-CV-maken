<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mijn cv's · Folio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- ?v= makes browsers load fresh files after a change: raise it whenever a CSS or JS file changes -->
    <link rel="stylesheet" href="css/colors.css?v=31" />
    <link rel="stylesheet" href="css/base.css?v=31" />
    <link rel="stylesheet" href="css/layout.css?v=31" />
    <link rel="stylesheet" href="css/components.css?v=31" />
    <link rel="stylesheet" href="css/cv-templates.css?v=31" />
    <link rel="stylesheet" href="css/pages.css?v=31" />
    <link rel="stylesheet" href="css/responsive.css?v=31" />
    <link rel="stylesheet" href="css/confirm-dialog.css?v=31" />
  </head>

  <body>
    <script src="js/theme.js?v=31"></script>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Folio home">
          <img class="brand-logo" src="images/folio-logo-light.png" alt="Folio" />
        </a>

        <nav class="topnav" aria-label="Hoofdnavigatie">
          <a class="active" href="my-resumes.html" aria-current="page">Mijn cv's</a>
          <a href="templates.html">Templates</a>
        </nav>

        <div class="topbar-actions">
          <button class="icon-button" id="themeButton" type="button" aria-label="Donkere modus wisselen">
            ◐
          </button>

          <div class="language-switcher" aria-label="Taal kiezen">
            <button class="flag-button active" id="dutchButton" type="button" aria-label="Nederlands">
              <span class="flag flag-nl" aria-hidden="true"></span>
            </button>
            <button class="flag-button" id="englishButton" type="button" aria-label="English">
              <span class="flag flag-gb" aria-hidden="true"></span>
            </button>
          </div>

          <div class="account-menu">
            <button class="avatar-button" id="accountButton" type="button" aria-label="Account menu openen"></button>

            <div class="account-dropdown hidden" id="accountDropdown">
              <a href="personal-details.html">Persoonlijke gegevens</a>
              <a href="index.html" data-sign-out>Uitloggen</a>
            </div>
          </div>
        </div>
      </header>

      <main class="page-card">
        <section class="page-heading">
          <div>
            <p class="eyebrow" id="pageLabel">Overzicht</p>
            <h1>Mijn cv's</h1>
            <p class="intro">
              Bewaar, bewerk en exporteer je cv's vanaf een overzichtelijke plek.
            </p>
          </div>

          <div class="heading-actions">
            <button class="primary-button" id="addResumeButton" type="button">
              Nieuw cv
            </button>
          </div>
        </section>

        <section class="toolbar" aria-label="Cv zoeken en filteren">
          <label class="search-field">
            <span>Zoeken</span>
            <input id="searchInput" type="search" placeholder="Zoek op naam of template" />
          </label>

          <label class="select-field">
            <span>Sorteer</span>
            <select id="sortSelect">
              <option value="recent">Laatst bewerkt</option>
              <option value="name">Naam</option>
            </select>
          </label>
        </section>

        <section id="resumeView" class="resume-grid" aria-live="polite"></section>

        <section id="emptyView" class="empty-state hidden" aria-live="polite">
          <div class="empty-illustration" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <p class="eyebrow">Empty state</p>
          <h2>Nog geen cv's</h2>
          <p>
            Begin met een template en bouw stap voor stap je eerste cv. Je kunt
            later altijd wisselen van ontwerp.
          </p>

          <div class="empty-actions">
            <button class="primary-button" id="emptyCreateButton" type="button">
              Kies template
            </button>
            <button class="secondary-button" id="backToResumesButton" type="button">
              Bekijk voorbeelddata
            </button>
          </div>
        </section>
      </main>
    </div>

    <div class="toast hidden" id="toastMessage" aria-live="polite"></div>

    <script src="js/translate.js?v=31"></script>
    <script src="js/account.js?v=31"></script>
    <script src="js/templates-data.js?v=31"></script>
    <script src="js/cv-store.js?v=31"></script>
    <script src="js/confirm-dialog.js?v=31"></script>
    <script src="js/cv-render.js?v=31"></script>
    <script src="js/script.js?v=31"></script>
  </body>
</html>
