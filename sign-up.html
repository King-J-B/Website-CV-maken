<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · Folio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to sign up</a>

  <div class="auth">
    <aside class="auth__brand" aria-label="About Folio">
      <a class="wordmark" href="index.html" aria-label="Folio home">
        <span class="wordmark__mark" aria-hidden="true">f.</span>
        <span>folio</span>
      </a>

      <div>
        <p class="brand__tagline">Your experience. Your next chapter.</p>
      </div>

      <div class="sample-card" aria-hidden="true">
        <p class="sample-card__name">Alex Morgan</p>
        <p class="sample-card__role">Product designer</p>
        <div class="sample-card__rule"></div>
        <p class="sample-card__heading">Experience</p>
        <div class="sample-card__line"></div>
        <div class="sample-card__line sample-card__line--mid"></div>
        <div class="sample-card__line sample-card__line--short"></div>
      </div>
    </aside>

    <main class="auth__main" id="main">
      <div class="auth__panel">
        <a class="wordmark wordmark--dark" href="index.html" aria-label="Folio home">
          <span class="wordmark__mark" aria-hidden="true">f.</span>
          <span>folio</span>
        </a>

        <h1 class="auth__title">Make your next move</h1>
        <p class="auth__subtitle">Create your Folio account to save your CV online.</p>

        <div class="stack stack--social">
          <a class="btn btn--secondary btn--block" href="/auth/google" data-provider="google">
            <svg class="btn__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </a>
          <a class="btn btn--secondary btn--block" href="/auth/linkedin" data-provider="linkedin">
            <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
            Continue with LinkedIn
          </a>
        </div>

        <div class="divider" role="separator">or</div>

        <form class="form stack" data-auth-form="sign-up" novalidate>
          <div class="alert alert--danger" role="alert" data-form-alert hidden></div>

          <div class="field">
            <label class="field__label" for="name">Full name</label>
            <input class="field__input" id="name" name="name" type="text"
                   autocomplete="name" required aria-describedby="name-error"
                   data-msg-required="Enter your full name.">
            <p class="field__error" id="name-error" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="email">Email address</label>
            <input class="field__input" id="email" name="email" type="email"
                   autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"
                   required data-validate="email" aria-describedby="email-error"
                   data-msg-required="Enter your email address.">
            <p class="field__error" id="email-error" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <div class="field__control">
              <input class="field__input field__input--with-toggle" id="password" name="password" type="password"
                     autocomplete="new-password" required data-minlength="12"
                     aria-describedby="password-hint password-error"
                     data-msg-required="Create a password."
                     data-msg-minlength="Use at least 12 characters.">
              <button class="field__toggle" type="button" data-toggle-password
                      aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
            </div>
            <p class="field__hint" id="password-hint">At least 12 characters</p>
            <p class="field__error" id="password-error" hidden></p>
          </div>

          <!--
            The Figma sign-up frame has no "Confirm password" field (the Show/Hide
            toggle covers typos). To add one, paste this block; auth.js already
            validates data-match.

          <div class="field">
            <label class="field__label" for="password-confirm">Confirm password</label>
            <div class="field__control">
              <input class="field__input field__input--with-toggle" id="password-confirm" name="passwordConfirm" type="password"
                     autocomplete="new-password" required data-match="#password"
                     aria-describedby="password-confirm-error"
                     data-msg-required="Enter your password again.">
              <button class="field__toggle" type="button" data-toggle-password
                      aria-controls="password-confirm" aria-pressed="false" aria-label="Show password">Show</button>
            </div>
            <p class="field__error" id="password-confirm-error" hidden></p>
          </div>
          -->

          <div class="check">
            <input class="check__input" id="terms" name="terms" type="checkbox" required
                   aria-describedby="terms-error"
                   data-msg-required="Accept the terms to create your account.">
            <label class="check__label" for="terms">
              I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>
            </label>
            <p class="field__error" id="terms-error" hidden></p>
          </div>

          <button class="btn btn--primary btn--block" type="submit">Create account</button>
        </form>

        <p class="auth__footer">Already have an account? <a href="sign-in.html" data-keep-query>Sign in</a></p>
      </div>
    </main>
  </div>

  <script src="auth.js"></script>
</body>
</html>
