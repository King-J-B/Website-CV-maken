<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a template · Folio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/folio-mark.png">
  <!-- ?v= makes browsers load fresh files after a change: raise it whenever a CSS or JS file changes -->
  <link rel="stylesheet" href="css/colors.css?v=33">
  <!-- The same top bar as My resumes -->
  <link rel="stylesheet" href="css/base.css?v=33">
  <link rel="stylesheet" href="css/layout.css?v=33">
  <link rel="stylesheet" href="css/components.css?v=33">
  <link rel="stylesheet" href="css/pages.css?v=33">
  <link rel="stylesheet" href="css/responsive.css?v=33">
  <link rel="stylesheet" href="css/cv-templates.css?v=33">
  <link rel="stylesheet" href="css/templates.css?v=33">
</head>
<body>
  <script src="js/theme.js?v=33"></script>
  <a class="skip-link" href="#main">Skip to templates</a>

  <div class="app-shell tp-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Folio home">
        <img class="brand-logo" src="images/folio-logo-light.png" alt="Folio">
      </a>

      <nav class="topnav" aria-label="Hoofdnavigatie">
        <a href="my-resumes.html">Mijn cv's</a>
        <a class="active" href="templates.html" aria-current="page">Templates</a>
      </nav>

      <div class="topbar-actions">
        <button class="icon-button" id="themeButton" type="button" aria-label="Donkere modus wisselen">◐</button>

        <div class="language-switcher" aria-label="Taal kiezen">
          <button class="flag-button" id="dutchButton" type="button" aria-label="Nederlands">
            <span class="flag flag-nl" aria-hidden="true"></span>
          </button>
          <button class="flag-button" id="englishButton" type="button" aria-label="English">
            <span class="flag flag-gb" aria-hidden="true"></span>
          </button>
        </div>

        <div class="account-menu">
          <button class="avatar-button" id="accountButton" type="button" aria-label="Account menu openen"></button>

          <div class="account-dropdown hidden" id="accountDropdown">
            <a href="personal-details.html">Persoonlijke gegevens</a>
            <a href="index.html" data-sign-out>Uitloggen</a>
          </div>
        </div>
      </div>
    </header>
  </div>

  <main class="tp-main" id="main">
    <p class="tp-eyebrow" data-new-only hidden>New CV</p>
    <h1 class="tp-title">Choose a template</h1>
    <p class="tp-sub">
      Every template uses the same content, so you can switch any time in the editor without retyping anything.
      A CV fits on one A4 page.
    </p>

    <p class="tp-error" role="alert" data-error hidden></p>

    <ul class="tp-grid" data-template-grid></ul>
  </main>

  <script src="js/translate.js?v=33"></script>
  <script src="js/account.js?v=33"></script>
  <script src="js/templates-data.js?v=33"></script>
  <script src="js/cv-store.js?v=33"></script>
  <script src="js/templates-page.js?v=33"></script>
</body>
</html>
